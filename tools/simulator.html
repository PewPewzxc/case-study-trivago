<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email Client Simulator</title>
<!--
  Shows one email the way six apps treat it, in light and dark mode.
  Open it through a local server so it can load ../email.html by itself:
      python -m http.server 8000      (run in the case-study folder)
      http://localhost:8000/tools/simulator.html
  Or open the file directly and pick an email with the file button.

  What it does per app (the "what this app did" list under each preview shows it live):
  - removes or keeps the parts of the HTML and CSS that app removes or keeps,
  - sets the screen width of that app,
  - recolours for dark mode the way that app does it (rules measured in tests/RESULTS.md).
  It runs in Chrome, so it cannot be Word: classic Outlook here is an approximation.
  For the real classic Outlook engine use tools/word_render.ps1 (its PNG shows up in the classic pane).
  Add ?selftest to the URL to run the checks for the colour and conditional-comment code (results in the console).
-->
<style>
  body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: #eceef1; color: #111; }
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; background: #fff; border-bottom: 1px solid #d6d9de; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  header label { display: inline-flex; gap: 6px; align-items: center; }
  #status { color: #555; }
  #grid { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; align-items: flex-start; }
  .card { background: #fff; border: 1px solid #d6d9de; border-radius: 8px; overflow: hidden; }
  .card.dark { background: #1b1b1b; border-color: #333; color: #e8e8e8; }
  .card h2 { margin: 0; padding: 8px 10px; font-size: 13px; border-bottom: 1px solid #d6d9de; }
  .card.dark h2 { border-color: #333; }
  .card iframe { display: block; border: 0; background: #fff; }
  .card details { max-width: 100%; padding: 6px 10px 8px; font-size: 12px; border-top: 1px solid #d6d9de; }
  .card.dark details { border-color: #333; }
  .card ul { margin: 4px 0 0; padding-left: 18px; }
  .warn { color: #a15c00; }
  .card.dark .warn { color: #ffb44d; }
  .word { display: block; max-width: 100%; }
</style>
</head>
<body>
<header>
  <h1>Email Client Simulator</h1>
  <label>Email <input type="file" id="file" accept=".html,.htm"></label>
  <label>Mode <select id="mode"><option value="both">Light + dark</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
  <label><input type="checkbox" id="noimg"> Images blocked</label>
  <label><input type="checkbox" id="nongoogle"> Gmail apps use a non-Google account</label>
  <label>Size <select id="zoom"><option>1</option><option selected>0.75</option><option>0.5</option></select></label>
  <span id="status">Pick an email file.</span>
</header>
<main id="grid"></main>

<script>
// One entry per app. width = the email's viewport in that app.
// dark: none | full (everything flipped) | partial (only light backgrounds and dark text change) | slate (partial, navy turns slate) | apple
const CLIENTS = [
  { id: 'gmail-web',       name: 'Gmail, web browser',          width: 800, gmail: true, dark: 'none' },
  { id: 'gmail-ios',       name: 'Gmail app, iPhone',            width: 390, gmail: true, app: true, mobile: true, dark: 'full' },
  { id: 'gmail-android',   name: 'Gmail app, Android',           width: 360, gmail: true, app: true, mobile: true, dark: 'partial', dropsStyleInDark: true, dropsBgImageInDark: true },
  { id: 'apple-ios',       name: 'Apple Mail, iPhone',           width: 390, mobile: true, dark: 'apple' },
  { id: 'outlook-classic', name: 'Outlook classic, Windows',     width: 800, mso: true, dark: 'full' },
  { id: 'outlook-new',     name: 'Outlook new, Windows / web',   width: 800, dark: 'slate', dropsGradientInDark: true },
];
const GMAIL_CLIP_BYTES = 102 * 1024;   // Gmail hides the rest behind "View entire message"
// Colours of each app's own dark background, and the darkest lightness it recolours to (both read from tests/screenshots).
const DARK_CANVAS = { 'gmail-ios': '#1f1f1f', 'gmail-android': '#1f1f1f', 'outlook-classic': '#2d2d2d', 'outlook-new': '#292929', 'apple-ios': '#000000' };
const DARK_FLOOR = { 'gmail-ios': 17, 'gmail-android': 13, 'outlook-classic': 18, 'outlook-new': 17 };
// CSS that Word (classic Outlook) does not support. Removed from inline styles and the stylesheet.
const MSO_UNSUPPORTED = ['max-width', 'min-width', 'max-height', 'border-radius', 'box-shadow', 'background-image', 'float', 'position',
  'opacity', 'text-shadow', 'transform', 'mix-blend-mode', 'box-sizing', 'object-fit'];

// ---------- colour helpers ----------
function parseRgb(s) {
  const m = s && s.match(/rgba?\(([^)]+)\)/);
  if (!m) return null;
  const [r, g, b, a = 1] = m[1].split(/[\s,\/]+/).filter(Boolean).map(Number);
  return a === 0 ? null : { r, g, b, a };
}
// CIE Lab (D65). Apps flip lightness and keep the hue: your light-blue banner turned dark teal, not grey.
const lin = v => (v /= 255) <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
const gam = v => 255 * (v <= 0.0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - 0.055);
const f = t => t > 216 / 24389 ? Math.cbrt(t) : (24389 / 27 * t + 16) / 116, fi = t => t ** 3 > 216 / 24389 ? t ** 3 : (116 * t - 16) / (24389 / 27);
function toLab({ r, g, b }) {
  [r, g, b] = [r, g, b].map(lin);
  const x = f((0.4124 * r + 0.3576 * g + 0.1805 * b) / 0.95047), y = f(0.2126 * r + 0.7152 * g + 0.0722 * b), z = f((0.0193 * r + 0.1192 * g + 0.9505 * b) / 1.08883);
  return { L: 116 * y - 16, A: 500 * (x - y), B: 200 * (y - z) };
}
function labCss({ L, A, B }, a = 1) {
  const y = (L + 16) / 116, x = fi(A / 500 + y) * 0.95047, z = fi(y - B / 200) * 1.08883, Y = fi(y);
  const rgb = [3.2406 * x - 1.5372 * Y - 0.4986 * z, -0.9689 * x + 1.8758 * Y + 0.0415 * z, 0.0557 * x - 0.2040 * Y + 1.0570 * z]
    .map(v => Math.round(Math.min(255, Math.max(0, gam(Math.max(0, v))))));
  return `rgba(${rgb.join(', ')}, ${a})`;
}
// Returns the new colour, or null for "leave it". kind is 'bg' or 'text'.
// floor = the darkest lightness that app uses (read from your screenshots: white became about L 13-18, never black).
function darkColour(css, kind, style, floor = 15) {
  const c = parseRgb(css);
  if (!c) return null;
  const lab = toLab(c), light = lab.L > 50, flip = () => labCss({ ...lab, L: Math.max(100 - lab.L, floor) }, c.a);
  if (style === 'full') return flip();
  // partial and slate: only light backgrounds and dark text are changed
  if (kind === 'bg' && light) return flip();
  if (kind === 'text' && !light) return flip();
  if (style === 'slate' && kind === 'bg' && lab.L < 25) return labCss({ L: 35, A: lab.A * 0.5, B: lab.B * 0.5 }, c.a);
  return null;
}

// ---------- conditional comments (classic Outlook only) ----------
// Evaluates the part inside [if ...] for Outlook 2016+ (mso 16). Anything that is not mso/IE/version/operators is treated as false.
function msoTrue(expr) {
  const js = expr.replace(/\b(gte|gt|lte|lt)?\s*(mso|IE)\s*(\d+)?/g, (_, op, who, ver) => {
    if (who === 'IE') return 'false';
    if (!op || !ver) return 'true';
    return String({ gte: 16 >= ver, gt: 16 > ver, lte: 16 <= ver, lt: 16 < ver }[op]);
  }).replace(/\|/g, '||').replace(/&/g, '&&');
  return /^(\s|[()!|&]|true|false)*$/.test(js) ? Function(`return (${js})`)() : false;  // only booleans reach Function
}
function applyConditionals(html, log) {
  let shown = 0, hidden = 0;
  // Revealed form first, because its end marker also ends with <![endif]-->
  html = html.replace(/<!--\[if ([^\]]+)\]><!-->([\s\S]*?)<!--<!\[endif\]-->/g, (_, e, body) => msoTrue(e) ? (shown++, body) : (hidden++, ''));
  html = html.replace(/<!--\[if ([^\]]+)\]>([\s\S]*?)<!\[endif\]-->/g, (_, e, body) => msoTrue(e) ? (shown++, body) : (hidden++, ''));
  log.push(`Read the [if mso] comments: ${shown} blocks shown, ${hidden} blocks hidden.`);
  return html;
}

// ---------- the per-app HTML pass, before the page is drawn ----------
function prepare(src, client, dark, opts) {
  const log = [], warn = [];
  let html = src.replace(/<script[\s\S]*?<\/script>/gi, '');
  const appDropsStyle = client.app && (opts.nonGoogle || (dark && client.dropsStyleInDark));

  if (client.gmail) {
    const bytes = new TextEncoder().encode(html).length;
    if (bytes > GMAIL_CLIP_BYTES) {
      html = new TextDecoder().decode(new TextEncoder().encode(html).slice(0, GMAIL_CLIP_BYTES)) + '<p style="font:13px Arial;color:#5f6368">[Message clipped] <u>View entire message</u></p>';
      warn.push(`Clipped: the HTML is ${(bytes / 1024).toFixed(0)} KB, Gmail shows only the first 102 KB.`);
    } else log.push(`HTML is ${(bytes / 1024).toFixed(0)} KB, under Gmail's 102 KB clipping limit.`);
  }
  if (client.mso) {
    html = applyConditionals(html, log);
    // <v:fill/> is not self-closing to an HTML parser: it would swallow everything after it.
    html = html.replace(/<((?:v|w|o):\w+)([^>]*?)\/>/gi, '<$1$2></$1>');
    // Word's gradient text (Nicole Merlin trick): the text keeps the gradient's colour in light and dark mode.
    html = html.replace(/<style[^>]*>[\s\S]*?<\/style>/gi, css => css.replace(/([^{}>]+)\{([^}]*mso-style-textfill-type\s*:\s*gradient[^}]*)\}/g, (_, sel, body) => {
      const hex = (body.match(/#([0-9a-f]{6})/i) || [, '000000'])[1];
      log.push(`Gradient text on ${sel.trim()}: drawn as #${hex}, never recoloured.`);
      return `${sel}{color:#${hex} !important; --sim-keep:1;}`;
    }));
  }

  const doc = new DOMParser().parseFromString(html, 'text/html');
  const meta = doc.querySelector('meta[name="color-scheme"]');
  const lightOnly = !!meta && /only/.test(meta.content) && !/dark/.test(meta.content);

  if (appDropsStyle) {
    doc.querySelectorAll('style, link[rel=stylesheet]').forEach(s => s.remove());
    warn.push(opts.nonGoogle ? 'Stylesheet dropped: Gmail apps do this for non-Google accounts. Only inline styles are left.'
                             : 'Stylesheet dropped: Gmail on Android does this in dark mode. Only inline styles are left.');
  }
  if (client.gmail) {
    // Gmail turns <body> into a div, keeps its class and id but not its style, and puts <u></u> before it (the "u + .body" hook).
    const body = doc.body, div = doc.createElement('div');
    div.className = body.className; div.id = body.id;
    while (body.firstChild) div.appendChild(body.firstChild);
    body.removeAttribute('style'); body.removeAttribute('bgcolor');
    body.append(doc.createElement('u'), div);
    log.push('<body> became a div without its style, with <u></u> before it.');
  }
  if (client.mso) {
    doc.querySelectorAll('xml').forEach(x => x.remove());
    let hiddenCount = 0;
    doc.querySelectorAll('[style*="mso-hide"]').forEach(e => { if (/mso-hide\s*:\s*all/i.test(e.getAttribute('style'))) { e.remove(); hiddenCount++; } });
    if (hiddenCount) log.push(`mso-hide:all removed ${hiddenCount} element(s).`);
    doc.querySelectorAll('[style*="mso-color-alt"]').forEach(e => e.dataset.simAlt = '1');
    const n = convertVml(doc);
    if (n) log.push(`Drew ${n} VML shape(s) as boxes (fill colour, size, rounded corners).`);
    if (/mso-color-alt|mso-style-textfill/.test(src)) warn.push('Uses Word-only dark-mode tricks; these follow your measured results, not Word itself.');
  }
  if (opts.noImages) {
    doc.querySelectorAll('img').forEach(i => i.removeAttribute('src'));
    doc.querySelectorAll('[background]').forEach(e => e.removeAttribute('background'));
    log.push('Images blocked: alt text shows instead.');
  }
  return { html: '<!DOCTYPE html>\n' + doc.documentElement.outerHTML, log, warn, lightOnly };
}

// VML is Word-only. Turn the common shapes into boxes so the layout and colours read right.
function convertVml(doc) {
  const shapes = [...doc.getElementsByTagName('*')].filter(e => /^v:(roundrect|rect|oval)$/i.test(e.tagName));
  // A fill can also come from a child <v:fill color="...">; read it before those children are removed.
  const childFill = new Map(shapes.map(s => { const f = [...s.children].find(c => /^v:fill$/i.test(c.tagName)); return [s, f && f.getAttribute('color')]; }));
  doc.querySelectorAll('*').forEach(e => { if (/^(v:fill|v:stroke|w:anchorlock|o:lock)$/i.test(e.tagName)) e.remove(); });
  for (const s of shapes.reverse()) {
    const st = s.getAttribute('style') || '', box = doc.createElement('div');
    const w = parseFloat((st.match(/width:\s*([\d.]+)/) || [])[1]) || 0, h = parseFloat((st.match(/height:\s*([\d.]+)/) || [])[1]) || 0;
    const fill = s.getAttribute('fillcolor') || childFill.get(s);
    const radius = /oval/i.test(s.tagName) ? '50%' : /roundrect/i.test(s.tagName) ? `${(parseFloat(s.getAttribute('arcsize')) || 0) / 100 * Math.min(w, h)}px` : '0';
    const stroked = !/^(f|false)$/i.test(s.getAttribute('stroke') || s.getAttribute('stroked') || 'f');
    box.style.cssText = `display:flex; align-items:center; justify-content:center; box-sizing:border-box; width:${w}px; min-height:${h}px; border-radius:${radius};`
      + (fill ? `background-color:${fill};` : '') + (stroked ? `border:1px solid ${s.getAttribute('strokecolor') || '#000'};` : '');
    box.dataset.simVml = '1';
    const tb = [...s.children].find(c => /^v:textbox$/i.test(c.tagName));
    const inner = doc.createElement('div');
    inner.style.width = '100%';
    while ((tb || s).firstChild) inner.appendChild((tb || s).firstChild);
    if (tb) tb.remove();
    box.appendChild(inner);
    const href = s.getAttribute('href');
    if (href) { const a = doc.createElement('a'); a.href = href; a.style.cssText = 'display:inline-block; text-decoration:none;'; a.appendChild(box); s.replaceWith(a); }
    else s.replaceWith(box);
  }
  return shapes.length;
}

// ---------- the per-app pass on the drawn page ----------
function afterLoad(frame, client, dark, prep) {
  const doc = frame.contentDocument, win = frame.contentWindow, { log, warn } = prep;
  const broken = [...doc.images].filter(i => i.getAttribute('src') && !i.naturalWidth).map(i => i.src.split('/').pop());
  if (broken.length) warn.push(`${broken.length} image(s) did not load: ${broken.join(', ')}. That is a hosting problem, not this app.`);

  // Stylesheet rules each app drops.
  let mediaDropped = 0, attrDropped = 0, schemeRules = 0, propsDropped = 0;
  const walk = (list, sheet) => {
    for (let i = list.length - 1; i >= 0; i--) {
      const r = list[i];
      if (r.media && /prefers-color-scheme/.test(r.media.mediaText)) {
        schemeRules++;
        const supported = client.dark === 'apple' && !prep.lightOnly;
        const wants = /dark/.test(r.media.mediaText) ? dark : !dark;
        if (!supported || !wants) { (r.parentRule || sheet).deleteRule(i); continue; }
        r.media.mediaText = r.media.mediaText.replace(/\(\s*prefers-color-scheme\s*:\s*\w+\s*\)/, '(min-width: 0px)');
      }
      if (r.media && client.mso) { (r.parentRule || sheet).deleteRule(i); mediaDropped++; continue; }
      if (r.selectorText && client.gmail && /\[/.test(r.selectorText)) { (r.parentRule || sheet).deleteRule(i); attrDropped++; continue; }
      if (r.selectorText && client.id === 'outlook-new' && /\[data-og/.test(r.selectorText)) { (r.parentRule || sheet).deleteRule(i); attrDropped++; continue; }
      if (r.style && client.mso) MSO_UNSUPPORTED.forEach(p => { if (r.style.getPropertyValue(p)) { r.style.removeProperty(p); propsDropped++; } });
      if (r.cssRules) walk(r.cssRules, r);
    }
  };
  for (const sh of doc.styleSheets) walk(sh.cssRules, sh);
  if (mediaDropped) log.push(`Ignored ${mediaDropped} @media block(s): Word has no media queries, so no mobile layout.`);
  if (attrDropped) log.push(`Dropped ${attrDropped} CSS rule(s) with [attribute] selectors (not supported here).`);
  if (schemeRules) log.push(client.dark === 'apple' && !prep.lightOnly ? `Used ${schemeRules} prefers-color-scheme block(s).` : `Ignored ${schemeRules} prefers-color-scheme block(s).`);

  if (client.mso) {
    doc.querySelectorAll('[style]').forEach(e => {
      if (e.dataset.simVml) return;  // stand-ins for VML shapes, which Word does draw rounded
      MSO_UNSUPPORTED.forEach(p => { if (e.style.getPropertyValue(p)) { e.style.removeProperty(p); propsDropped++; } });
      if (/^(inline-block|flex|grid|inline-flex)$/.test(e.style.display)) { e.style.removeProperty('display'); propsDropped++; }
      if (/^(DIV|A|SPAN)$/.test(e.tagName) && !e.dataset.simVml && e.style.padding) { e.style.removeProperty('padding'); propsDropped++; }
      if (e.tagName === 'IMG' && !e.hasAttribute('width') && e.style.width) { e.style.removeProperty('width'); propsDropped++; }
    });
    if (propsDropped) log.push(`Removed ${propsDropped} CSS properties Word does not support (max-width, border-radius, gradients, inline-block, padding on div/a...).`);
  }

  if (dark) darkPass(doc, win, client, prep);

  // Phones shrink an email that is wider than the screen.
  const de = doc.documentElement;
  if (client.mobile && de.scrollWidth > client.width + 1) {
    const z = client.width / de.scrollWidth;
    de.style.zoom = z;
    warn.push(`Wider than the screen (${de.scrollWidth}px): shrunk to ${(z * 100).toFixed(0)}% to fit.`);
  }
  frame.style.height = (de.scrollHeight * (parseFloat(de.style.zoom) || 1) + 4) + 'px';
}

function darkPass(doc, win, client, prep) {
  const { log } = prep, style = client.dark;
  if (style === 'none') { log.push('Dark mode: the email is left as it is (only the app around it turns dark).'); return; }
  if (style === 'apple') {
    if (prep.lightOnly) { log.push('Dark mode: color-scheme "light only" is respected, nothing changes.'); return; }
    const s = doc.createElement('style');
    s.textContent = ':where(html){background:#000;color:#fff}';
    doc.head.appendChild(s);
    log.push('Dark mode: no "light only", so the default background and text turn dark/white; set colours stay.');
    return;
  }
  // Read everything first, then write, so one change does not feed the next read.
  const plan = [];
  for (const e of doc.querySelectorAll('html, body, body *')) {
    if (/^(IMG|STYLE|SCRIPT|BR)$/.test(e.tagName)) continue;
    const cs = win.getComputedStyle(e);
    plan.push({ e, bg: cs.backgroundColor, fg: cs.color, bi: cs.backgroundImage, border: parseFloat(cs.borderTopWidth) ? cs.borderTopColor : null, keep: cs.getPropertyValue('--sim-keep').trim() === '1' });
  }
  let bgs = 0, texts = 0, kept = 0, imgs = 0;
  for (const p of plan) {
    const vml = p.e.dataset.simVml === '1';
    if (!vml) {
      const nb = darkColour(p.bg, 'bg', style, DARK_FLOOR[client.id]);
      if (nb) { p.e.style.setProperty('background-color', nb, 'important'); bgs++; }
      if (p.border) { const nbd = darkColour(p.border, 'bg', style, DARK_FLOOR[client.id]); if (nbd) p.e.style.setProperty('border-color', nbd, 'important'); }
    } else kept++;
    if (p.bi !== 'none' && ((client.dropsGradientInDark && /gradient/.test(p.bi)) || client.dropsBgImageInDark)) { p.e.style.setProperty('background-image', 'none', 'important'); imgs++; }
    if (p.keep) continue;
    if (client.mso && p.e.closest('[data-sim-alt]')) { p.e.style.setProperty('color', '#ffffff', 'important'); continue; }
    const nf = darkColour(p.fg, 'text', style, DARK_FLOOR[client.id]);
    if (nf) { p.e.style.setProperty('color', nf, 'important'); texts++; }
  }
  // The app's own dark canvas shows wherever the email has no background.
  if (!parseRgb(win.getComputedStyle(doc.documentElement).backgroundColor)) doc.documentElement.style.background = DARK_CANVAS[client.id];
  const how = { full: 'every colour flipped (light becomes dark, dark becomes light)', partial: 'light backgrounds turned dark, dark text turned light; dark backgrounds and light text stay',
    slate: 'light backgrounds turned dark, navy turned slate, dark text turned light' }[style];
  log.push(`Dark mode: ${how}. ${bgs} backgrounds and ${texts} text colours changed. Images are never changed.`);
  if (kept) log.push(`${kept} VML shape(s) kept their fill; the text on them is still recoloured.`);
  if (imgs) log.push(`${imgs} background image(s)/gradient(s) ignored in dark mode.`);
  if (style === 'full' && client.gmail) log.push('Ignores color-scheme "light only" (as in your October 2026 test sends).');
}

// ---------- page ----------
const $ = id => document.getElementById(id);
let source = null, sourceName = '';

function renderAll() {
  if (!source) return;
  const grid = $('grid'), zoom = parseFloat($('zoom').value), modes = $('mode').value === 'both' ? [false, true] : [$('mode').value === 'dark'];
  const opts = { noImages: $('noimg').checked, nonGoogle: $('nongoogle').checked };
  grid.innerHTML = '';
  for (const client of CLIENTS) for (const dark of modes) {
    const prep = prepare(source, client, dark, opts);
    const card = document.createElement('section');
    card.className = 'card' + (dark ? ' dark' : '');
    card.style.width = client.width + 'px';
    card.style.zoom = zoom;
    card.innerHTML = `<h2>${client.name} · ${dark ? 'dark' : 'light'}</h2>`;
    const frame = document.createElement('iframe');
    frame.style.width = client.width + 'px';
    frame.title = `${client.name}, ${dark ? 'dark' : 'light'} mode`;
    frame.srcdoc = prep.html;
    const details = document.createElement('details');
    frame.onload = () => {
      afterLoad(frame, client, dark, prep);
      details.innerHTML = `<summary>What this app did${prep.warn.length ? ` <span class="warn">(${prep.warn.length} warning${prep.warn.length > 1 ? 's' : ''})</span>` : ''}</summary><ul>`
        + prep.warn.map(w => `<li class="warn">${w}</li>`).join('') + prep.log.map(l => `<li>${l.replace(/</g, '&lt;')}</li>`).join('') + '</ul>';
      setTimeout(() => afterResize(frame), 600);  // images arriving late change the height
    };
    card.append(frame, details);
    if (client.mso && !dark && sourceName) {
      // Real Word render from tools/word_render.ps1, if one exists for this file
      const img = new Image();
      img.className = 'word'; img.alt = 'Word render';
      img.src = `word-render/${sourceName.replace(/\.html?$/i, '')}.png?${Date.now()}`;
      img.onload = () => { const d = document.createElement('details'); d.innerHTML = '<summary>Real Word render (classic Outlook engine)</summary>'; d.appendChild(img); card.appendChild(d); };
    }
    grid.appendChild(card);
  }
  $('status').textContent = `${sourceName} · ${CLIENTS.length * modes.length} previews`;
}
function afterResize(frame) {
  const de = frame.contentDocument && frame.contentDocument.documentElement;
  if (de) frame.style.height = (de.scrollHeight * (parseFloat(de.style.zoom) || 1) + 4) + 'px';
}

$('file').onchange = async e => { const f = e.target.files[0]; if (f) { source = await f.text(); sourceName = f.name; renderAll(); } };
['mode', 'noimg', 'nongoogle', 'zoom'].forEach(id => $(id).onchange = renderAll);
if (location.protocol.startsWith('http')) fetch('../email.html').then(r => r.ok ? r.text() : null).then(t => { if (t && !source) { source = t; sourceName = 'email.html'; renderAll(); } });

// ---------- self-check (?selftest) ----------
if (location.search.includes('selftest')) {
  const eq = (a, b, what) => console.assert(a === b, `${what}: got ${a}, expected ${b}`) || a === b;
  const results = [
    eq(msoTrue('mso'), true, 'mso'), eq(msoTrue('!mso'), false, '!mso'), eq(msoTrue('gte mso 16'), true, 'gte mso 16'),
    eq(msoTrue('lt mso 12'), false, 'lt mso 12'), eq(msoTrue('mso | IE'), true, 'mso | IE'), eq(msoTrue('IE'), false, 'IE'),
    eq(applyConditionals('a<!--[if mso]>M<![endif]-->b<!--[if !mso]><!-->H<!--<![endif]-->c', []), 'aMbc', 'conditionals'),
    eq(labCss(toLab({ r: 0, g: 136, b: 217 })), 'rgba(0, 136, 217, 1)', 'Lab round trip'),
    eq(Math.round(toLab(parseRgb(darkColour('rgb(255, 255, 255)', 'bg', 'full', 17))).L), 17, 'white bg, full, stops at the floor'),
    eq(toLab(parseRgb(darkColour('rgb(229, 245, 255)', 'bg', 'full', 17))).B < -3, true, 'light blue stays bluish when dark'),
    eq(darkColour('rgb(0, 0, 0)', 'text', 'full'), 'rgba(255, 255, 255, 1)', 'black text, full'),
    eq(darkColour('rgb(255, 255, 255)', 'text', 'partial'), null, 'white text, partial stays'),
    eq(darkColour('rgb(10, 17, 33)', 'bg', 'partial'), null, 'navy bg, partial stays'),
    eq(Math.round(toLab(parseRgb(darkColour('rgb(10, 17, 33)', 'bg', 'slate'))).L), 35, 'navy bg, slate'),
    eq(darkColour('rgba(0, 0, 0, 0)', 'bg', 'full'), null, 'transparent stays'),
  ];
  console.log(`selftest: ${results.filter(Boolean).length}/${results.length} passed`);
}
</script>
